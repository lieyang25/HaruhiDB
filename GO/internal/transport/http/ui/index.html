<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HaruhiDB Web Console</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">HaruhiDB</p>
      <h1>Web Console</h1>
      <p class="sub">纯动作执行控制台：切库、快捷动作、JSON Envelope 执行。</p>
    </header>

    <section class="panel db-panel">
      <h2>数据库上下文</h2>
      <div class="row">
        <label for="dbPathInput">数据库路径</label>
        <div class="inline-actions">
          <input id="dbPathInput" type="text" placeholder="/abs/path/to/database.db">
          <button id="switchDbBtn" type="button">切换数据库</button>
        </div>
      </div>
      <div class="row">
        <label for="recentDbSelect">最近使用</label>
        <div class="inline-actions">
          <select id="recentDbSelect"></select>
          <button id="useRecentBtn" class="ghost" type="button">使用选中路径</button>
        </div>
      </div>
      <p id="dbInfo" class="db-info">当前数据库: (未连接)</p>
    </section>

    <section class="panel quick-panel">
      <h2>快捷动作面板</h2>
      <p id="capabilitiesInfo" class="subtle">加载能力中...</p>

      <div class="quick-grid">
        <div class="quick-card">
          <h3>list_tables</h3>
          <button id="qaListTablesBtn" type="button">执行 list_tables</button>
        </div>

        <div class="quick-card">
          <h3>describe_table</h3>
          <div class="row">
            <label for="qaDescribeTable">表名</label>
            <select id="qaDescribeTable"></select>
          </div>
          <button id="qaDescribeBtn" type="button">执行 describe_table</button>
        </div>

        <div class="quick-card">
          <h3>drop_table</h3>
          <div class="row">
            <label for="qaDropTable">表名</label>
            <select id="qaDropTable"></select>
          </div>
          <button id="qaDropBtn" class="danger" type="button">执行 drop_table</button>
        </div>
      </div>

      <div class="quick-create">
        <h3>create_table</h3>
        <div class="row">
          <label for="qaCreateTableName">表名</label>
          <input id="qaCreateTableName" type="text" placeholder="例如 users">
        </div>
        <div class="row">
          <label>列定义</label>
          <div id="qaColumns" class="columns"></div>
          <div class="inline-actions">
            <button id="qaAddColumnBtn" class="ghost" type="button">新增列</button>
            <button id="qaCreateBtn" type="button">执行 create_table</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel input-panel">
      <h2>Action JSON 控制台</h2>
      <div class="row">
        <label for="actionSelect">Action</label>
        <select id="actionSelect"></select>
      </div>

      <div class="row">
        <label for="modeSelect">Mode</label>
        <select id="modeSelect">
          <option value="read_only">read_only</option>
          <option value="read_write">read_write</option>
        </select>
      </div>

      <div class="row text-row">
        <label for="argsInput">Args JSON</label>
        <textarea id="argsInput" rows="8" spellcheck="false">{}</textarea>
      </div>

      <div class="actions">
        <button id="buildEnvelopeBtn" class="ghost" type="button">生成 Envelope</button>
        <button id="runEnvelopeBtn" type="button" class="primary">执行 Envelope</button>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="panel output-panel">
      <div class="output-head">
        <h2>Envelope Preview</h2>
        <button id="copyEnvelopeBtn" class="ghost small" type="button">复制</button>
      </div>
      <pre id="envelopeOut" class="json">{}</pre>
    </section>

    <section class="panel output-panel">
      <div class="output-head">
        <h2>Execution Result</h2>
        <button id="copyExecutionBtn" class="ghost small" type="button">复制</button>
      </div>
      <pre id="executionOut" class="json">{}</pre>
    </section>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
