<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HaruhiDB Web Console</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">HaruhiDB</p>
      <h1>Web Console</h1>
      <p class="sub">把自然语言翻译成 Action，再选择执行。先预览，后落库。</p>
    </header>

    <section class="panel input-panel">
      <div class="row">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="read_only">read_only</option>
          <option value="read_write" selected>read_write</option>
        </select>
      </div>

      <div class="row">
        <label for="authToken">Auth Token (optional)</label>
        <input id="authToken" type="password" placeholder="Bearer token without Bearer prefix">
      </div>

      <div class="row text-row">
        <label for="nlInput">Natural Language</label>
        <textarea id="nlInput" rows="8" spellcheck="false">严格只输出与目标直接相关的动作，不允许任何额外动作。请按顺序仅执行 4 步：1) insert_row(table=student, values={id:303,name:'instruct_test'})；2) get_by_primary_int(table=student,key=303)；3) delete_by_primary_int(table=student,key=303)；4) get_by_primary_int(table=student,key=303)。禁止 list_tables/table_exists/describe_table/scan_all/scan_primary_int_range/update_by_primary_int。</textarea>
      </div>

      <div class="actions">
        <button id="strictBtn" class="ghost" type="button">填入严格四步示例</button>
        <button id="translateBtn" type="button">仅翻译</button>
        <button id="runBtn" type="button" class="primary">翻译并执行</button>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="panel output-panel">
      <div class="output-head">
        <h2>Translation Result</h2>
        <button id="copyTranslationBtn" class="ghost small" type="button">复制</button>
      </div>
      <pre id="translationOut" class="json">{}</pre>
    </section>

    <section class="panel output-panel">
      <div class="output-head">
        <h2>Execution Result</h2>
        <button id="copyExecutionBtn" class="ghost small" type="button">复制</button>
      </div>
      <pre id="executionOut" class="json">{}</pre>
    </section>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
